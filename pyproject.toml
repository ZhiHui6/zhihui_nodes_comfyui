[project]
name = "zhiai-nodes-comfyui"
description = "ComfyUI custom nodes collection with 56 nodes: multi-engine translation, text processing, prompt generators, image tools, Qwen3-VL vision understanding, Florence2 image analysis, LM Studio integration, and more."
version = "2.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "opencv-python",
    "huggingface_hub",
    "modelscope",
    "transformers>=4.57.0",
    "openai>=1.0.0",
    "timm>=0.9.16",
    "nvidia-ml-py",
    "einops",
    "cryptography",
    "scikit-image",
]

[project.urls]
Homepage = "https://github.com/ZhiHui6/zhiai_nodes_comfyui"
Repository = "https://github.com/ZhiHui6/zhiai_nodes_comfyui"
Documentation = "https://github.com/ZhiHui6/zhiai_nodes_comfyui#readme"
Issues = "https://github.com/ZhiHui6/zhiai_nodes_comfyui/issues"

[tool.comfy]
PublisherId = "ZhiHui6"
DisplayName = "ZhiAI Nodes"
Icon = "https://raw.githubusercontent.com/ZhiHui6/zhiai_nodes_comfyui/main/icon.png"
includes = []